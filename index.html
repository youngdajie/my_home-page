<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">

		<!-- 以下是 site.config.ts 的 meta 注入，改配置即可，不用动这里 -->
		<title>%SITE_TITLE%</title>
		<meta name="description" content="%SITE_DESCRIPTION%">
		<meta name="keywords" content="%SITE_KEYWORDS%">
		<meta name="author" content="%SITE_AUTHOR%">
		<meta name="theme-color" content="%SITE_THEME_COLOR%">

		<meta property="og:title" content="%SITE_TITLE%">
		<meta property="og:type" content="website">
		<meta property="og:locale" content="%SITE_LOCALE%">
		<meta property="og:url" content="%SITE_URL%">
		<meta property="og:description" content="%SITE_OG_DESCRIPTION%">
		<meta property="og:site_name" content="%SITE_NAME%">

		<link rel="canonical" href="%SITE_URL%">

		<!-- 图标三件套：ico 兼容老浏览器 / svg 矢量 / iOS 桌面图标 -->
		<link rel="icon" href="/favicon.ico" sizes="any">
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
		<link rel="manifest" href="/manifest.json">

		<!-- 正文字体走 CDN（自建仓库，四套霞鹜文楷的字重子集）。
		     加载方式刻意不是阻塞式 <link rel=stylesheet>：
		     CDN 一旦抽风，阻塞式样式表会把整页首屏一直卡住（实测旧地址 20s 无响应）。
		     这里用「preload 抢优先级 + media=print 不阻塞渲染，到货后切回 all」，
		     配合 CSS 里的 font-display: swap，最坏情况只是先用系统字体显示、随后换字。 -->
		<link rel="preconnect" href="https://cdn.jsdmirror.com" crossorigin>
		<link
			rel="preload"
			as="style"
			href="https://cdn.jsdmirror.com/cnb/youngdajie/fonts@main/lxgw/style.min.css"
		>
		<link
			rel="stylesheet"
			href="https://cdn.jsdmirror.com/cnb/youngdajie/fonts@main/lxgw/style.min.css"
			media="print"
			onload="this.media='all'"
		>
	</head>
	<body id="xiaojie_index">
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
